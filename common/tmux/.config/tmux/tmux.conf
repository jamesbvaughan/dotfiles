# pane resizing bindings
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -n – resize-pane -Z

# pane navigation bindings
# bind-key -n 'C-j' select-pane -D
# bind-key -n 'C-k' select-pane -U
# bind-key -n 'C-h' select-pane -L
# bind-key -n 'C-l' select-pane -R

# window navigation bindings
bind-key -n 'M-l' next-window
bind-key -n 'M-h' previous-window

# workmux bindings
bind-key -n 'M-s' display-popup -h 30 -w 100 -E "workmux dashboard"
bind-key -n 'M-t' run-shell "workmux sidebar"

# don't rename windows for me
set-option -g allow-rename off

# vim keys
setw -g mode-keys vi

# let notifications and progress updates reach the outer terminal
set -g allow-passthrough on

# distinguish between Enter and Shift+Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# mouse support
set -gq mouse on

### Colors - kanagawa dragon
set -g @thm_bg      "#181616"
set -g @thm_surface "#282727"
set -g @thm_fg      "#c5c9c5"
set -g @thm_gray    "#a6a69c"
set -g @thm_red     "#c4746e"
set -g @thm_green   "#87a987"
set -g @thm_yellow  "#c4b28a"
set -g @thm_blue    "#8ba4b0"
set -g @thm_aqua    "#8ea4a2"
set -g @thm_violet  "#8992a7"
set -g @thm_orange  "#b6927b"

# kanagawa.nvim ships no tmux extra and every community port is stale (all
# under 10 stars, none pushed recently), so the status line is hand-rolled
# from the palette above. tmux-cpu and tmux-battery still supply the values.
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"
set -g message-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g message-command-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g mode-style "bg=#{@thm_surface},fg=#{@thm_fg}"
set -g pane-border-style "fg=#{@thm_surface}"
set -g pane-active-border-style "fg=#{@thm_green}"

# Status line
# Each right-hand segment is: rounded cap, icon on an accent colour, value on
# the surface tone, rounded cap.
## Left
set -g status-left-length 100
set -g status-left ""
set -ag status-left "#[fg=#{@thm_green}]#[fg=#{@thm_bg},bg=#{@thm_green},bold] #S #[fg=#{@thm_green},bg=default] "
## Windows
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@thm_gray}] #I #W "
set -g window-status-current-format "#[fg=#{@thm_blue}]#[fg=#{@thm_bg},bg=#{@thm_blue},bold] #I #W #[fg=#{@thm_blue},bg=default]"
## Right
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#[fg=#{@thm_violet}]#[fg=#{@thm_bg},bg=#{@thm_violet}]  #[fg=#{@thm_fg},bg=#{@thm_surface}] #{b:pane_current_command} #[fg=#{@thm_surface},bg=default]"
set -ag status-right "#[fg=#{@thm_aqua}]#[fg=#{@thm_bg},bg=#{@thm_aqua}]  #[fg=#{@thm_fg},bg=#{@thm_surface}] #{cpu_percentage} #[fg=#{@thm_surface},bg=default]"
set -ag status-right "#[fg=#{@thm_yellow}]#[fg=#{@thm_bg},bg=#{@thm_yellow}]  #[fg=#{@thm_fg},bg=#{@thm_surface}] #(uptime -p | sed -E 's/^up //; s/ years?/y/; s/ weeks?/w/; s/ days?/d/; s/ hours?/h/; s/ minutes?/m/; s/,//g') #[fg=#{@thm_surface},bg=default]"
set -ag status-right "#[fg=#{@thm_orange}]#[fg=#{@thm_bg},bg=#{@thm_orange}] #{battery_icon} #[fg=#{@thm_fg},bg=#{@thm_surface}] #{battery_percentage} #[fg=#{@thm_surface},bg=default]"
### Custom current time section
set -ag status-right "#[fg=#{@thm_red}]#[fg=#{@thm_bg},bg=#{@thm_red}]  #[fg=#{@thm_fg},bg=#{@thm_surface}] %H:%M #[fg=#{@thm_surface},bg=default]"

# TPM plugins to install
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Change the regular expression used to detect vim. This pattern must be
# compatible with `grep -iE` extended regular expression syntax.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

# Override the shell logic for detecting vim. The default check only inspects
# processes on the pane's own tty (`ps -t '#{pane_tty}'`), which misses nvim
# when `atuin hex` runs the shell behind a PTY proxy: the proxy stays on the
# pane tty while the real shell + nvim run on a separate pty. is_vim.sh walks
# the process tree from the pane tty instead, crossing that boundary.
# https://github.com/christoomey/vim-tmux-navigator/issues/460
# The plugin substitutes '@vim_navigator_pattern' below with the option above.
set -g @vim_navigator_check "~/.config/tmux/is_vim.sh '#{pane_tty}' '@vim_navigator_pattern'"

# Fancy terminal things
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -as terminal-overrides ',xterm-256color:RGB'    # full color support
set -as terminal-overrides ',xterm*:sitm=\E[3m'     # italics support

# Bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Remember to run prefix+I to install plugins on new machines!
# Run prefix+U to update plugins.
run '~/.config/tmux/plugins/tpm/tpm'
