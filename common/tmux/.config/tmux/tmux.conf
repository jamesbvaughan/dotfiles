# pane resizing bindings
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -n – resize-pane -Z

# pane navigation bindings
# bind-key -n 'C-j' select-pane -D
# bind-key -n 'C-k' select-pane -U
# bind-key -n 'C-h' select-pane -L
# bind-key -n 'C-l' select-pane -R

# window navigation bindings
bind-key -n 'M-h' next-window
bind-key -n 'M-l' previous-window

# don't rename windows for me
set-option -g allow-rename off

# vim keys
setw -g mode-keys vi

# let notifications and progress updates reach the outer terminal
set -g allow-passthrough on

# distinguish between Enter and Shift+Enter
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# mouse support
set -gq mouse on

# light mode
# set -g @catppuccin_flavour 'latte'
# dark mode
set -g @catppuccin_flavour 'mocha'

# These shouldn't be necessary, but they are right now.
# See https://github.com/catppuccin/tmux/issues/441
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #W'

# To update this plugin, navigate to this directory and git pull.
run ~/.config/tmux/plugins/tmux/catppuccin.tmux

# Status line
## Left
set -g status-left-length 100
set -g status-left ""
set -ag status-left "#{E:@catppuccin_status_session}"
## Right
set -g status-right-length 100
set -g status-right ""
set -ag status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"
### Custom current time section
set -ag status-right "#[bg=#{@thm_flamingo},fg=#{@thm_crust}]#[reverse]#[noreverse] "
set -ag status-right "#[fg=#{@thm_fg},bg=#{@thm_surface_0}] %H:%M "

# TPM plugins to install
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'b0o/tmux-autoreload'
# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Change the regular expression used to detect vim. This pattern must be
# compatible with `grep -iE` extended regular expression syntax.
set -g @vim_navigator_pattern '(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'

# Override the shell logic for detecting vim. The default check only inspects
# processes on the pane's own tty (`ps -t '#{pane_tty}'`), which misses nvim
# when `atuin hex` runs the shell behind a PTY proxy: the proxy stays on the
# pane tty while the real shell + nvim run on a separate pty. is_vim.sh walks
# the process tree from the pane tty instead, crossing that boundary.
# https://github.com/christoomey/vim-tmux-navigator/issues/460
# The plugin substitutes '@vim_navigator_pattern' below with the option above.
set -g @vim_navigator_check "~/.config/tmux/is_vim.sh '#{pane_tty}' '@vim_navigator_pattern'"

# Fancy terminal things
# set -g default-terminal "screen-256color"
set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'  # undercurl support
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underscore colours - needs tmux-3.0
set -as terminal-overrides ',xterm-256color:RGB'    # full color support
set -as terminal-overrides ',xterm*:sitm=\E[3m'     # italics support

# Bootstrap tpm
if "test ! -d ~/.config/tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm && ~/.config/tmux/plugins/tpm/bin/install_plugins'"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
# Remember to run prefix+I to install plugins on new machines!
# Run prefix+U to update plugins.
run '~/.config/tmux/plugins/tpm/tpm'
