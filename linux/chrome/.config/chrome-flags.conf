# Shared Chromium / Electron flags config
# Lines starting with # are stripped by wrapper scripts.

# Use GTK 4 for Chrome's own dialogs (file pickers and the like) so they match
# the GTK 4 / libadwaita apps rather than looking a decade older.
--gtk-version=4

# UI scale factor for crisp vector scaling at integer display scale 1
--force-device-scale-factor=1.4

