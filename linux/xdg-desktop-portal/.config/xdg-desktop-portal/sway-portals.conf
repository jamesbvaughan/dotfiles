# Which portal backend answers which interface, so screen sharing works.
#
# xdg-desktop-portal-gtk implements no ScreenCast at all -- check the
# Interfaces line in /usr/share/xdg-desktop-portal/portals/gtk.portal and it
# simply isn't there, because upstream leaves that to the compositor's own
# backend (mutter on GNOME). With only the GTK backend installed, every "share
# your screen" button in Zoom, Slack or Chrome fails with nothing useful in the
# logs. xdg-desktop-portal-wlr is the wlroots-side implementation.
#
# The filename matters: xdg-desktop-portal looks for
# $XDG_CURRENT_DESKTOP-portals.conf, splitting on ':'. Ours is "sway:wlroots",
# so this file is found as the "sway" half.
#
# wlr's .portal already declares UseIn=...sway..., so it would likely be picked
# up without this file. Naming it explicitly means the choice doesn't depend on
# backend-scoring behaviour that has changed between portal releases.

[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
# wlr is the only backend offering this one too -- gtk.portal doesn't list
# Screenshot either. Sway's own keybindings use grimshot directly and don't go
# through the portal at all; this is for apps that ask.
org.freedesktop.impl.portal.Screenshot=wlr
