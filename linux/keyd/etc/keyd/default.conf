# keyd config for the Framework's built-in keyboard.
#
# Lives in /etc (not $HOME), so it's symlinked rather than stowed:
#   sudo ln -s ~/.dotfiles/linux/keyd/etc/keyd/default.conf /etc/keyd/default.conf
#   sudo keyd reload

[ids]
# Internal keyboard only ("AT Translated Set 2 keyboard"), so external
# boards like the Voyager are left alone.
0001:0001

[main]
# Tap f -> f, hold f -> nav layer. lettermod avoids misfires while typing:
# f pressed within 150ms of another key is always f, and it must be held
# 200ms to count as a hold.
f = lettermod(nav, f, 150, 200)

[nav]
h = left
j = down
k = up
l = right
